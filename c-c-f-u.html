<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Compulsive Content Follow-up</title><link rel="icon" href="spm.ico"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--bg-color:#faf9f6;--surface-color:#fff;--border-color:#e2dfdc;--border-focus:#706b63;--text-main:#2c2a29;--text-muted:#6e6963;--accent:#1a1918;--accent-hover:#383532;--success:#2e7d32;--header-color:#4338ca;--font-serif:'Newsreader',serif;--font-sans:'Plus Jakarta Sans',sans-serif}*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}body{font-family:var(--font-sans);background:var(--bg-color);color:var(--text-main);line-height:1.6;padding:40px 20px;-webkit-font-smoothing:antialiased}.document-container{max-width:900px;margin:0 auto;background:var(--surface-color);border:1px solid var(--border-color);border-radius:12px;padding:48px 40px;box-shadow:0 4px 24px rgba(0,0,0,.02)}.doc-header{text-align:center;margin-bottom:40px;border-bottom:1px solid var(--border-color);padding-bottom:30px}.doc-title{font-family:var(--font-serif);font-size:2.2rem;font-weight:600;letter-spacing:-.02em;color:var(--header-color);margin-bottom:8px}.doc-subtitle{font-size:.95rem;color:var(--text-muted);font-weight:400}.section-heading{font-family:var(--font-serif);font-size:1.3rem;font-weight:600;color:var(--accent);margin:36px 0 16px;padding-bottom:8px;border-bottom:1px dashed var(--border-color)}.input-group{margin-bottom:20px}.input-label{display:block;font-size:.9rem;font-weight:500;color:var(--text-main);margin-bottom:8px}.doc-input{width:100%;padding:12px 16px;font-family:var(--font-sans);font-size:.95rem;color:var(--text-main);background:var(--bg-color);border:1px solid var(--border-color);border-radius:8px;resize:vertical;min-height:100px;transition:border-color .2s,box-shadow .2s}.doc-input:focus{outline:none;border-color:var(--border-focus);background:var(--surface-color);box-shadow:0 0 0 3px rgba(112,107,99,.1)}.output-card{margin-top:30px;background:var(--bg-color);border:1px solid var(--border-color);border-radius:8px;padding:24px}.output-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.output-title{font-family:var(--font-serif);font-size:1.1rem;font-weight:600;color:var(--accent)}.prompt-preview{width:100%;min-height:180px;background:var(--surface-color);border:1px solid var(--border-color);border-radius:6px;padding:16px;font-family:var(--font-sans);font-size:.9rem;color:var(--text-main);line-height:1.5;resize:vertical;white-space:pre-wrap;margin-bottom:16px}.copy-btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;font-size:.85rem;font-weight:500;border-radius:6px;cursor:pointer;transition:background .2s}.copy-btn:hover{background:var(--accent-hover)}.copy-btn.copied{background:var(--success)}.reset-btn{background:#fff;color:var(--accent);border:1px solid var(--border-color);padding:10px 20px;font-size:.85rem;font-weight:500;border-radius:6px;cursor:pointer;transition:background .2s,border-color .2s}.reset-btn:hover{background:var(--bg-color);border-color:var(--border-focus)}.doc-footer{text-align:center;margin-top:50px;font-size:.85rem;color:var(--text-muted);border-top:1px solid var(--border-color);padding-top:20px}@media(max-width:640px){body{padding:18px 10px;line-height:1.65}.document-container{width:100%;padding:28px 16px;border-radius:10px}.doc-header{margin-bottom:30px;padding-bottom:24px}.doc-title{font-size:1.75rem;line-height:1.2;margin-bottom:10px}.doc-subtitle{font-size:.88rem;line-height:1.55}.section-heading{font-size:1.2rem;line-height:1.3;margin:30px 0 14px}.input-group{margin-bottom:22px}.input-label{font-size:.88rem;line-height:1.45;margin-bottom:9px}.doc-input{min-height:120px;padding:13px 14px;font-size:.9rem;line-height:1.55}.output-card{margin-top:22px;padding:18px 14px}.output-header{margin-bottom:10px}.output-title{font-size:1.05rem}.prompt-preview{min-height:240px;padding:14px;font-size:.86rem;line-height:1.6;margin-bottom:14px}.copy-btn{width:100%;min-height:44px;padding:11px 16px;font-size:.85rem}.doc-footer{margin-top:36px;padding-top:18px;font-size:.78rem;line-height:1.5}}@media(max-width:640px){.reset-btn{width:100%;min-height:44px}}@media(max-width:380px){body{padding:14px 7px}.document-container{padding:24px 12px}.doc-title{font-size:1.6rem}.doc-subtitle{font-size:.82rem}.section-heading{font-size:1.12rem}.doc-input{min-height:115px;font-size:.86rem}.prompt-preview{min-height:220px;font-size:.82rem}}
</style></head><body><div class="document-container"><header class="doc-header"><h1 class="doc-title">Compulsive Content Follow-up</h1><p class="doc-subtitle">(to generate final content from a keyword and "compulsive content" and product description for ice cold traffic)</p></header><section><h2 class="section-heading">1. Variables &amp; Inputs</h2>
<div class="input-group"><label class="input-label" for="contentWithoutAI">[CONTENT without AI Prompt]</label><textarea id="contentWithoutAI" class="doc-input" oninput="updatePrompts()"></textarea></div>
<div class="input-group"><label class="input-label" for="aiPrompt">[AI PROMPT]</label><textarea id="aiPrompt" class="doc-input" oninput="updatePrompts()"></textarea></div>
<div class="input-group"><label class="input-label" for="noteForUser">[NOTE FOR USER OF THIS PROMPT]</label><textarea id="noteForUser" class="doc-input" oninput="updatePrompts()"></textarea></div>
<div class="input-group"><label class="input-label" for="newContent">[New Content with AI Prompt]</label><textarea id="newContent" class="doc-input" oninput="updatePrompts()"></textarea></div><button class="reset-btn" type="button" onclick="resetAll()">Reset All</button></section><section><h2 class="section-heading">2. Prompts</h2><div class="output-card"><div class="output-header"><span class="output-title">Prompt#1</span></div><textarea id="promptOutput1" class="prompt-preview" readonly></textarea><button class="copy-btn" onclick="copyPrompt('promptOutput1',this)">Copy to Clipboard</button></div><div class="output-card"><div class="output-header"><span class="output-title">Prompt#2</span></div><textarea id="promptOutput2" class="prompt-preview" readonly></textarea><button class="copy-btn" onclick="copyPrompt('promptOutput2',this)">Copy to Clipboard</button></div><div class="output-card"><div class="output-header"><span class="output-title">Prompt#3</span></div><textarea id="promptOutput3" class="prompt-preview" readonly></textarea><button class="copy-btn" onclick="copyPrompt('promptOutput3',this)">Copy to Clipboard</button></div><div class="output-card"><div class="output-header"><span class="output-title">Prompt#4</span></div><textarea id="promptOutput4" class="prompt-preview" readonly></textarea><button class="copy-btn" onclick="copyPrompt('promptOutput4',this)">Copy to Clipboard</button></div><div class="output-card"><div class="output-header"><span class="output-title">Prompt#5</span></div><textarea id="promptOutput5" class="prompt-preview" readonly></textarea><button class="copy-btn" onclick="copyPrompt('promptOutput5',this)">Copy to Clipboard</button></div></section><footer class="doc-footer">Copyright &copy; <script>document.write(new Date().getFullYear())</script> Siva Prasad Mukherjee. All Rights Reserved.</footer></div><script>
const prompt1Template="https://spmhqo.github.io/dp/c-c.html";const prompt2Template="নীচে দেওয়া CONTENT-এ নীচে দেওয়া AI PROMPT আর NOTE FOR USER OF THIS PROMPT-কে add and integrate করো:\n\nCONTENT\n\n[CONTENT without AI Prompt]\n\nAI PROMPT\n \n[AI PROMPT]\n\nNOTE FOR USER OF THIS PROMPT\n\n[NOTE FOR USER OF THIS PROMPT]";const prompt3Template="নীচে দেওয়া CONTENTটি সম্পূর্ণভাবে পর্যালোচনা করুন এবং শুধুমাত্র CONTENT-এ থাকা তথ্যের ভিত্তিতে একটি comprehensive Product Description তৈরি করুন।\n\nএই Product Description-টি একটি marketing prompt generation application-এর “Offer Description” input field-এ সরাসরি ব্যবহার করা হবে। তাই description-টি promotional কাজের জন্য যথেষ্ট informative হবে, কিন্তু unsupported marketing claim তৈরি করবে না।\n\nCONTENT থেকে প্রয়োজনীয় তথ্য শনাক্ত করে নিচের structure অনুযায়ী Product Description তৈরি করুন।\n\nProduct Name:\nPDF-এ product-এর যে নাম দেওয়া আছে, সেটি ব্যবহার করুন।\n\nWhat it is:\nProduct-টি আসলে কী, কী ধরনের digital product এবং এর মূল উদ্দেশ্য কী—সংক্ষেপে ও পরিষ্কারভাবে লিখুন।\n\nWhat is included:\nProduct-এর মধ্যে বাস্তবে কী কী আছে, তার একটি comprehensive list দিন\n\nCONTENT\n\n[New Content with AI Prompt]";const prompt4Template="https://spmhqo.github.io/dp/ice-cold-traffic-light.html";const prompt5Template="https://spmhqo.github.io/dp/refine-facebook-post.html";
function updatePrompts(){const a=document.getElementById('contentWithoutAI').value,b=document.getElementById('aiPrompt').value,c=document.getElementById('noteForUser').value,d=document.getElementById('newContent').value;document.getElementById('promptOutput1').value=prompt1Template;document.getElementById('promptOutput2').value=prompt2Template.replaceAll('[CONTENT without AI Prompt]',a).replaceAll('[AI PROMPT]',b).replaceAll('[NOTE FOR USER OF THIS PROMPT]',c);document.getElementById('promptOutput3').value=prompt3Template.replace('[New Content with AI Prompt]',d);document.getElementById('promptOutput4').value=prompt4Template;document.getElementById('promptOutput5').value=prompt5Template}
async function copyPrompt(id,btn){const box=document.getElementById(id);try{await navigator.clipboard.writeText(box.value)}catch(e){box.select();box.setSelectionRange(0,99999);document.execCommand('copy');window.getSelection().removeAllRanges()}const t=btn.textContent;btn.textContent='✓ Copied!';btn.classList.add('copied');setTimeout(()=>{btn.textContent=t;btn.classList.remove('copied')},2000)}function resetAll(){document.getElementById('contentWithoutAI').value='';document.getElementById('aiPrompt').value='';document.getElementById('noteForUser').value='';document.getElementById('newContent').value='';updatePrompts()}window.onload=updatePrompts;
</script></body></html>
